<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>EL BANKO | Canlı Yarış Yayını</title>
<style>
:root{--gold:#d9b45b;--line:#393124}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#39301b 0,#111114 36%,#08090b 75%);color:#f8f5ed;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:20px}
header{display:flex;align-items:center;justify-content:center;padding:18px 0 22px;border-bottom:1px solid #292a30}
.logo{font-weight:950;letter-spacing:4px;font-size:28px}.logo span{color:var(--gold)}
h1{text-align:center;font-size:clamp(25px,5vw,40px);margin:26px 0 8px}
.sub{text-align:center;color:#a7abb5;margin:0 0 22px}
.player{width:100%;aspect-ratio:16/9;min-height:240px;background:#000;border:1px solid #514326;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #0008}
.player iframe{display:block;width:100%;height:100%;border:0}
.note{text-align:center;color:#a7abb5;font-size:12px;margin:14px auto 0;max-width:720px}
footer{text-align:center;color:#777b84;font-size:12px;padding:24px 0 8px}
@media(max-width:600px){.wrap{padding:12px}.player{min-height:210px}}
</style>
</head>
<body><main class="wrap">
<header><div class="logo">EL <span>BANKO</span></div></header>
<h1>Canlı Yarış Yayını</h1>
<p class="sub">TAY TV</p>
<section class="player" aria-label="TAY TV canlı yayın oynatıcısı">
<iframe src="https://www.youtube-nocookie.com/embed/live_stream?channel=UCjkRA7KEdp7PDKDUs396XHg&autoplay=1" title="TAY TV canlı yarış yayını" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</section>
<p class="note">Yayın, TAY TV canlı yayını açık olduğunda oynatılır.</p>
<footer>© EL BANKO</footer>
</main></body></html>
